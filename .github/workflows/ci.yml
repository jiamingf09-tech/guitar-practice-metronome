name: CI / Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  # ─── Test (3 OS in parallel) ──────────────────────────────────────────────
  test:
    name: Test – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # ─── macOS arm64 ─────────────────────────────────────────────────────────
  build-macos:
    name: Build – macOS arm64
    needs: test
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          zip -r GuitarMetronome-macos-arm64.zip "guitar_metronome.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/macos/Build/Products/Release/GuitarMetronome-macos-arm64.zip

  # ─── Windows x64 ─────────────────────────────────────────────────────────
  build-windows:
    name: Build – Windows x64
    needs: test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath GuitarMetronome-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: GuitarMetronome-windows-x64.zip

  # ─── Linux x64 ───────────────────────────────────────────────────────────
  build-linux:
    name: Build – Linux x64
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package
        run: |
          tar -czf GuitarMetronome-linux-x64.tar.gz \
            -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: GuitarMetronome-linux-x64.tar.gz

  # ─── Android APK ─────────────────────────────────────────────────────────
  build-android:
    name: Build – Android APK
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk GuitarMetronome-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: GuitarMetronome-android.apk

  # ─── iOS (unsigned) ──────────────────────────────────────────────────────
  build-ios:
    name: Build – iOS (unsigned)
    needs: test
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r GuitarMetronome-ios-unsigned.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: GuitarMetronome-ios-unsigned.ipa

  # ─── GitHub Release ───────────────────────────────────────────────────────
  release:
    name: Release ${{ github.ref_name }}
    needs: [build-macos, build-windows, build-linux, build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Guitar Metronome ${{ github.ref_name }}
          body: |
            ## Guitar Metronome ${{ github.ref_name }}

            Cross-platform metronome for guitar practice — macOS · Windows · Linux · Android · iOS.

            ### Features
            - Adjustable BPM (30–300) with slider and +/− buttons
            - Tap tempo
            - Time signatures (4/4 · 3/4 · 6/8 · 5/4)
            - Subdivisions (quarter · eighth · triplet · sixteenth · mixed)
            - Count-in (1–4 bars)
            - Speed trainer (auto BPM ramp)
            - Silent bars (gap click)
            - Practice timer
            - Local presets
            - English / 中文 UI

            ### Downloads
            | Platform | File |
            |---|---|
            | macOS arm64 | `GuitarMetronome-macos-arm64.zip` |
            | Windows x64 | `GuitarMetronome-windows-x64.zip` |
            | Linux x64 | `GuitarMetronome-linux-x64.tar.gz` |
            | Android | `GuitarMetronome-android.apk` |
            | iOS (unsigned) | `GuitarMetronome-ios-unsigned.ipa` |

            > **macOS:** Right-click → Open on first launch (app is not notarized).
            > **iOS:** Requires sideloading via AltStore or Sideloadly.
          files: |
            artifacts/macos-arm64/GuitarMetronome-macos-arm64.zip
            artifacts/windows-x64/GuitarMetronome-windows-x64.zip
            artifacts/linux-x64/GuitarMetronome-linux-x64.tar.gz
            artifacts/android-apk/GuitarMetronome-android.apk
            artifacts/ios-unsigned/GuitarMetronome-ios-unsigned.ipa
          draft: false
          prerelease: false
